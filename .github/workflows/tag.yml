name: Auto Tag

on:
  push:
    branches: [ main ]

permissions:
  contents: write

# Two merges close together otherwise both read the same "latest tag" and compute
# the same next version, so one run fails on a duplicate tag or the versions land
# out of order. Higher stakes here than in salary-calculator: this tag is pushed
# with TAG_PAT specifically so it triggers ios-testflight.yml, so a tagging race
# turns into a duplicated or skipped TestFlight build.
concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the action can find the previous tag

      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          # PAT (NOT the default GITHUB_TOKEN) so the pushed tag triggers
          # ios-testflight.yml. Tags pushed with GITHUB_TOKEN do not start
          # other workflows. The PAT needs Contents: Read and write on this repo.
          github_token: ${{ secrets.TAG_PAT }}
          default_bump: patch          # feat: -> minor, BREAKING CHANGE -> major
          tag_prefix: v
