name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Build for iOS Simulator
      run: |
        xcodebuild clean build \
          -scheme incomatic \
          -configuration Debug \
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
          -quiet

    # A failing test must fail the job. This previously ended in
    # `|| echo "No tests found"` with `continue-on-error: true`, which swallowed
    # the exit code twice — 23 broken tests reported green before that was found.
    # The target has tests; if it ever stops having them, that is also worth failing on.
    - name: Run tests
      run: |
        xcodebuild test \
          -scheme incomatic \
          -configuration Debug \
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
          -quiet
