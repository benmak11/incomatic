name: iOS TestFlight

on:
  workflow_dispatch:        # manual run from the Actions tab
  push:
    tags: [ "v*" ]          # e.g. push tag v1.0.0

permissions:
  contents: write   # the beta lane pushes a build/X.Y.Z+N tag after uploading

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26   # Xcode 26 / iOS 26 SDK; macos-latest still ships Xcode 16.x
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Configure git identity
        # The beta lane pushes an annotated build/X.Y.Z+N tag, and annotated
        # tags need an author. Runners have no git identity by default, so
        # without this the tag silently fails to be created.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize Secrets.xcconfig
        # The committed Secrets.xcconfig is gitignored, so it is absent on CI. Without
        # this, $(API_BASE_URL_PROD) resolves to empty and the build ships pointing at
        # no backend. The SECRETS_XCCONFIG secret must hold the FULL file in the same
        # format as Config/Secrets.xcconfig.example (note the $() escape on the URL).
        run: |
          mkdir -p Config
          cat > Config/Secrets.xcconfig <<'EOF'
          ${{ secrets.SECRETS_XCCONFIG }}
          EOF

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:                    ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane beta
