# SonarQube Cloud — read by the plain sonar-scanner CLI (no Gradle/Xcode
# plugin here; incomatic is analyzed via a coverage-enabled xcodebuild + test
# run, converted to Sonar's generic coverage XML with slather).
# sonar.organization / sonar.projectKey come from CI secrets (see
# .github/workflows/build.yml, `sonar` job) to keep this file identical across
# environments — mirrors salary-calculator's build.gradle sonar{} block.

sonar.projectName=incomatic
sonar.sourceEncoding=UTF-8

sonar.sources=incomatic
sonar.tests=incomaticTests

# Generated/asset code and previews aren't worth grading.
sonar.exclusions=**/Preview Content/**,**/*.xcassets/**,**/*.entitlements,**/GeneratedAssetSymbols.swift
sonar.coverage.exclusions=**/incomaticTests/**,**/Preview Content/**,**/IncomaticApp.swift

sonar.coverageReportPaths=sonarqube-generic-coverage.xml
